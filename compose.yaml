# compose.yml
name: brikoo

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: brikoo-php:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./:/app
    init: true
    command: ["sleep", "infinity"]